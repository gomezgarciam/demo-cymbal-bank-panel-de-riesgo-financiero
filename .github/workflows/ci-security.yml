name: CI & Seguridad Bancaria — Cymbal Bank MVP

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Auditoría de Secretos y API Keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar escáner preventivo de secretos
        run: python3 scripts/scan_secrets.py

  test-api:
    name: Backend cymbal-riesgo-api (pytest + Decimal + RBAC)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ejecutar pruebas unitarias e integración
        run: pytest -v

  test-web:
    name: Frontend cymbal-riesgo-web (ESLint + Next.js Build)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint y compilación standalone
        run: npm run lint && npm run build

  validate-infra:
    name: Validar IaC Terraform (formato y sintaxis)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Verificar formato Terraform
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: Validar configuración Terraform
        working-directory: infra/terraform
        run: terraform init -backend=false && terraform validate
