services:
  cymbal-riesgo-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - CYMBAL_APP_ENV=development
      - CYMBAL_STORAGE_BACKEND=memory
      - CYMBAL_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  cymbal-riesgo-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - API_INTERNAL_URL=http://cymbal-riesgo-api:8080
    depends_on:
      cymbal-riesgo-api:
        condition: service_healthy
